<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camera Pro</title>

<style>
body { margin:0; overflow:hidden; background:black; }

video {
  position:fixed;
  width:100%;
  height:100%;
  object-fit:cover;
  image-rendering:auto;
}

.overlay {
  position:fixed;
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
}

.controls {
  position:fixed;
  bottom:20px;
  width:100%;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.thumb {
  width:60px;
  height:80px;
  background:#222;
  border-radius:8px;
  overflow:hidden;
}
.thumb img {
  width:100%;
  height:100%;
  object-fit:cover;
}

.shutter {
  width:80px;
  height:80px;
  border:4px solid white;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
}
.shutter-inner {
  width:60px;
  height:60px;
  background:white;
  border-radius:50%;
  transition:0.1s;
}
.shutter:active .shutter-inner {
  transform:scale(0.8);
}

.filter-switch {
  width:60px;
  height:60px;
  border:2px solid white;
  border-radius:10px;
  overflow:hidden;
}
.filter-switch img {
  width:100%;
  height:100%;
}

/* 濾鏡縮圖裁切 */
.vertical-crop {
  object-fit: cover;
  object-position: bottom;
}
.horizontal-crop {
  object-fit: cover;
  object-position: center;
}

.flash {
  position:fixed;
  width:100%;
  height:100%;
  background:white;
  opacity:0;
  pointer-events:none;
  transition:0.2s;
}

.preview {
  position:fixed;
  width:100%;
  height:100%;
  background:black;
  display:none;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}
.preview img {
  max-width:90%;
  max-height:80%;
}
</style>
</head>

<body>

<video id="camera" autoplay playsinline muted></video>
<img id="overlay" class="overlay">

<div class="controls">
  <div class="thumb"><img id="thumbImg"></div>

  <div class="shutter" onclick="takePhoto()">
    <div class="shutter-inner"></div>
  </div>

  <div class="filter-switch" onclick="switchFilter()">
    <img id="filterThumb">
  </div>
</div>

<div id="flash" class="flash"></div>

<div id="preview" class="preview">
  <img id="previewImg">
  <button onclick="closePreview()">返回</button>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
const video = document.getElementById('camera');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const overlay = document.getElementById('overlay');
const flash = document.getElementById('flash');
const preview = document.getElementById('preview');
const previewImg = document.getElementById('previewImg');
const thumbImg = document.getElementById('thumbImg');
const filterThumb = document.getElementById('filterThumb');

/* 濾鏡 */
const filters = [
  { src: "filter1.png", type: "vertical" },
  { src: "filter2.png", type: "vertical" },
  { src: "filter3.png", type: "horizontal" }
];

let currentFilter = 0;

function updateFilter() {
  const f = filters[currentFilter];
  overlay.src = f.src;
  filterThumb.src = f.src;

  filterThumb.className =
    f.type === "vertical" ? "vertical-crop" : "horizontal-crop";
}

function switchFilter() {
  currentFilter = (currentFilter + 1) % filters.length;
  updateFilter();
}

/* 🚀 高畫質相機 */
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1920, max: 3840 },
        height: { ideal: 1080, max: 2160 },
        aspectRatio: { ideal: 16/9 }
      }
    });
    video.srcObject = stream;

  } catch (err) {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" }
    });
    video.srcObject = stream;
  }
}

startCamera();

/* 裁切函數 */
function getCrop(vw, vh, ratio) {
  let sw, sh, sx, sy;

  if (vw / vh > ratio) {
    sh = vh;
    sw = vh * ratio;
    sx = (vw - sw) / 2;
    sy = 0;
  } else {
    sw = vw;
    sh = vw / ratio;
    sx = 0;
    sy = (vh - sh) / 2;
  }

  return { sx, sy, sw, sh };
}

/* 📸 拍照 */
function takePhoto() {

  const vw = video.videoWidth;
  const vh = video.videoHeight;
  const isHorizontal = filters[currentFilter].type === "horizontal";

  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";

  if (isHorizontal) {

    const crop = getCrop(vw, vh, 16/9);

    const temp = document.createElement('canvas');
    temp.width = 1920;
    temp.height = 1080;
    const tctx = temp.getContext('2d');

    tctx.drawImage(video, crop.sx, crop.sy, crop.sw, crop.sh, 0, 0, 1920, 1080);
    tctx.drawImage(overlay, 0, 0, 1920, 1080);

    canvas.width = 1920;
    canvas.height = 1080;

    ctx.save();
    ctx.translate(canvas.width/2, canvas.height/2);
    ctx.rotate(-Math.PI/2);

    ctx.drawImage(
      temp,
      -canvas.height/2,
      -canvas.width/2,
      canvas.height,
      canvas.width
    );

    ctx.restore();

  } else {

    const crop = getCrop(vw, vh, 9/16);

    canvas.width = 1080;
    canvas.height = 1920;

    ctx.drawImage(video, crop.sx, crop.sy, crop.sw, crop.sh, 0, 0, 1080, 1920);
    ctx.drawImage(overlay, 0, 0, 1080, 1920);
  }

  flash.style.opacity = 1;
  setTimeout(()=> flash.style.opacity = 0, 100);

  const data = canvas.toDataURL('image/png');

  previewImg.src = data;
  thumbImg.src = data;
  preview.style.display = "flex";

  const now = new Date();
  const filename =
    now.getFullYear()+"-"+
    String(now.getMonth()+1).padStart(2,'0')+"-"+
    String(now.getDate()).padStart(2,'0')+"_"+
    String(now.getHours()).padStart(2,'0')+
    String(now.getMinutes()).padStart(2,'0')+
    String(now.getSeconds()).padStart(2,'0')+".png";

  const link = document.createElement('a');
  link.download = filename;
  link.href = data;
  link.click();
}

function closePreview(){
  preview.style.display = "none";
}

updateFilter();
</script>

</body>
</html>
