<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camera Filter</title>

<style>
body { margin:0; overflow:hidden; background:black; }

video {
  position:fixed;
  width:100%;
  height:100%;
  object-fit:cover;
}

.overlay {
  position:fixed;
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
}

/* UI */
.controls {
  position:fixed;
  bottom:20px;
  width:100%;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

/* 左：預覽 */
.thumb {
  width:60px;
  height:80px;
  background:#222;
  border-radius:8px;
  overflow:hidden;
}
.thumb img {
  width:100%;
  height:100%;
  object-fit:cover;
}

/* 中：拍照 */
.shutter {
  width:80px;
  height:80px;
  border:4px solid white;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
}
.shutter-inner {
  width:60px;
  height:60px;
  background:white;
  border-radius:50%;
  transition:0.1s;
}
.shutter:active .shutter-inner {
  transform:scale(0.8);
}

/* 右：濾鏡 */
.filter-switch {
  width:60px;
  height:60px;
  border:2px solid white;
  border-radius:10px;
  overflow:hidden;
}
.filter-switch img {
  width:100%;
  height:100%;
}

/* ✅ 直式：保留下方（裁掉上方） */
.vertical-crop {
  object-fit: cover;
  object-position: bottom;
}

/* ✅ 橫式：水平置中裁切 */
.horizontal-crop {
  object-fit: cover;
  object-position: center;
}

/* 閃光 */
.flash {
  position:fixed;
  width:100%;
  height:100%;
  background:white;
  opacity:0;
  pointer-events:none;
  transition:0.2s;
}

/* 預覽 */
.preview {
  position:fixed;
  width:100%;
  height:100%;
  background:black;
  display:none;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}
.preview img {
  max-width:90%;
  max-height:80%;
}
</style>
</head>

<body>

<video id="camera" autoplay playsinline></video>
<img id="overlay" class="overlay">

<div class="controls">
  <div class="thumb"><img id="thumbImg"></div>

  <div class="shutter" onclick="takePhoto()">
    <div class="shutter-inner"></div>
  </div>

  <div class="filter-switch" onclick="switchFilter()">
    <img id="filterThumb">
  </div>
</div>

<div id="flash" class="flash"></div>

<div id="preview" class="preview">
  <img id="previewImg">
  <button onclick="closePreview()">返回</button>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
const video = document.getElementById('camera');
const canvas = document.getElementById('canvas');
const overlay = document.getElementById('overlay');
const flash = document.getElementById('flash');
const preview = document.getElementById('preview');
const previewImg = document.getElementById('previewImg');
const thumbImg = document.getElementById('thumbImg');
const filterThumb = document.getElementById('filterThumb');

const filters = [
  { src: "filter1.png", type: "vertical" },
  { src: "filter2.png", type: "vertical" },
  { src: "filter3.png", type: "horizontal" }
];

let currentFilter = 0;

function updateFilter() {
  const f = filters[currentFilter];
  overlay.src = f.src;
  filterThumb.src = f.src;

  if (f.type === "vertical") {
    filterThumb.className = "vertical-crop";
  } else {
    filterThumb.className = "horizontal-crop";
  }
}

function switchFilter() {
  currentFilter = (currentFilter + 1) % filters.length;
  updateFilter();
}

/* 後鏡頭 */
navigator.mediaDevices.getUserMedia({
  video: {
    facingMode: "environment",
    width: { ideal: 1920 },
    height: { ideal: 1080 }
  }
}).then(stream => {
  video.srcObject = stream;
});

/* 拍照 */
function takePhoto() {
  const ctx = canvas.getContext('2d');
  const isHorizontal = filters[currentFilter].type === "horizontal";

  if (isHorizontal) {
    canvas.width = 1920;
    canvas.height = 1080;

    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    ctx.drawImage(overlay, 0, 0, canvas.width, canvas.height);

  } else {
    canvas.width = 1080;
    canvas.height = 1920;

    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    ctx.drawImage(overlay, 0, 0, canvas.width, canvas.height);
  }

  flash.style.opacity = 1;
  setTimeout(()=> flash.style.opacity = 0, 100);

  const data = canvas.toDataURL('image/png');

  previewImg.src = data;
  thumbImg.src = data;
  preview.style.display = "flex";

  const now = new Date();
  const filename =
    now.getFullYear()+"-"+
    String(now.getMonth()+1).padStart(2,'0')+"-"+
    String(now.getDate()).padStart(2,'0')+"_"+
    String(now.getHours()).padStart(2,'0')+
    String(now.getMinutes()).padStart(2,'0')+
    String(now.getSeconds()).padStart(2,'0')+".png";

  const link = document.createElement('a');
  link.download = filename;
  link.href = data;
  link.click();
}

function closePreview(){
  preview.style.display = "none";
}

updateFilter();
</script>

</body>
</html>
