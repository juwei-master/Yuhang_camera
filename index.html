<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camera Filter</title>

<style>
body { margin:0; overflow:hidden; background:black; }

video {
  position:fixed;
  width:100%;
  height:100%;
  object-fit:cover;
}

.overlay {
  position:fixed;
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
}

.controls {
  position:fixed;
  bottom:20px;
  width:100%;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.thumb {
  width:60px;
  height:80px;
  background:#222;
  border-radius:8px;
  overflow:hidden;
}
.thumb img {
  width:100%;
  height:100%;
  object-fit:cover;
}

.shutter {
  width:80px;
  height:80px;
  border:4px solid white;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
}
.shutter-inner {
  width:60px;
  height:60px;
  background:white;
  border-radius:50%;
  transition:0.1s;
}
.shutter:active .shutter-inner {
  transform:scale(0.8);
}

.filter-switch {
  width:60px;
  height:60px;
  border:2px solid white;
  border-radius:10px;
  overflow:hidden;
}
.filter-switch img {
  width:100%;
  height:100%;
}

.flash {
  position:fixed;
  width:100%;
  height:100%;
  background:white;
  opacity:0;
  pointer-events:none;
  transition:0.2s;
}

.preview {
  position:fixed;
  width:100%;
  height:100%;
  background:black;
  display:none;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}
.preview img {
  max-width:90%;
  max-height:80%;
}
</style>
</head>

<body>

<video id="camera" autoplay playsinline></video>
<img id="overlay" class="overlay">

<div class="controls">
  <div class="thumb"><img id="thumbImg"></div>

  <div class="shutter" onclick="takePhoto()">
    <div class="shutter-inner"></div>
  </div>

  <div class="filter-switch" onclick="switchFilter()">
    <img id="filterThumb">
  </div>
</div>

<div id="flash" class="flash"></div>

<div id="preview" class="preview">
  <img id="previewImg">
  <button onclick="closePreview()">返回</button>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
const video = document.getElementById('camera');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const overlay = document.getElementById('overlay');
const flash = document.getElementById('flash');
const preview = document.getElementById('preview');
const previewImg = document.getElementById('previewImg');
const thumbImg = document.getElementById('thumbImg');
const filterThumb = document.getElementById('filterThumb');

const filters = [
  { src: "filter1.png", type: "vertical" },
  { src: "filter2.png", type: "vertical" },
  { src: "filter3.png", type: "horizontal" }
];

let currentFilter = 0;

function updateFilter() {
  const f = filters[currentFilter];
  overlay.src = f.src;
  filterThumb.src = f.src;
}

function switchFilter() {
  currentFilter = (currentFilter + 1) % filters.length;
  updateFilter();
}

/* 相機初始化 */
navigator.mediaDevices.getUserMedia({
  video: {
    facingMode: { ideal: "environment" },
    aspectRatio: { ideal: 16/9 },
    width: { ideal: 4096 },
    height: { ideal: 2160 }
  }
}).then(stream => {
  video.srcObject = stream;
});

/* 拍照 */
function takePhoto() {

  const vw = video.videoWidth;
  const vh = video.videoHeight;
  const isHorizontal = filters[currentFilter].type === "horizontal";

  if (isHorizontal) {

    // 🧩 STEP1：先畫「原始畫面 + 濾鏡」
    const tempCanvas = document.createElement('canvas');
    const tctx = tempCanvas.getContext('2d');

    tempCanvas.width = vw;
    tempCanvas.height = vh;

    // 不裁切、不拉伸
    tctx.drawImage(video, 0, 0, vw, vh);
    tctx.drawImage(overlay, 0, 0, vw, vh);

    // 🧩 STEP2：旋轉輸出
    canvas.width = 1920;
    canvas.height = 1080;

    ctx.save();

    // 逆時針90°
    ctx.translate(0, canvas.height);
    ctx.rotate(-Math.PI / 2);

    // 這裡用 cover 縮放進去（但不是裁切來源）
    ctx.drawImage(tempCanvas, 0, 0, vh, vw);

    ctx.restore();

  } else {

    canvas.width = 1080;
    canvas.height = 1920;

    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    ctx.drawImage(overlay, 0, 0, canvas.width, canvas.height);
  }

  flash.style.opacity = 1;
  setTimeout(()=> flash.style.opacity = 0, 100);

  const data = canvas.toDataURL('image/png');

  previewImg.src = data;
  thumbImg.src = data;
  preview.style.display = "flex";

  const link = document.createElement('a');
  link.download = "photo.png";
  link.href = data;
  link.click();
}

function closePreview(){
  preview.style.display = "none";
}

updateFilter();
</script>

</body>
</html>
