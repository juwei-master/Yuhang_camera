<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camera Filter</title>

<style>
body { margin:0; overflow:hidden; background:black; }

video {
  position:fixed;
  width:100%;
  height:100%;
  object-fit:cover;
}

.overlay {
  position:fixed;
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
}

.controls {
  position:fixed;
  bottom:20px;
  width:100%;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.thumb {
  width:60px;
  height:80px;
  background:#222;
  border-radius:8px;
  overflow:hidden;
}
.thumb img {
  width:100%;
  height:100%;
  object-fit:cover;
}

.shutter {
  width:80px;
  height:80px;
  border:4px solid white;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
}
.shutter-inner {
  width:60px;
  height:60px;
  background:white;
  border-radius:50%;
  transition:0.1s;
}
.shutter:active .shutter-inner {
  transform:scale(0.8);
}

.filter-switch {
  width:60px;
  height:60px;
  border:2px solid white;
  border-radius:10px;
  overflow:hidden;
}
.filter-switch img {
  width:100%;
  height:100%;
}

.vertical-crop {
  object-fit: cover;
  object-position: bottom;
}

.horizontal-crop {
  object-fit: cover;
  object-position: center;
}

.flash {
  position:fixed;
  width:100%;
  height:100%;
  background:white;
  opacity:0;
  pointer-events:none;
  transition:0.2s;
}

.preview {
  position:fixed;
  width:100%;
  height:100%;
  background:black;
  display:none;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}
.preview img {
  max-width:90%;
  max-height:80%;
}
</style>
</head>

<body>

<video id="camera" autoplay playsinline></video>
<img id="overlay" class="overlay">

<div class="controls">
  <div class="thumb"><img id="thumbImg"></div>

  <div class="shutter" onclick="takePhoto()">
    <div class="shutter-inner"></div>
  </div>

  <div class="filter-switch" onclick="switchFilter()">
    <img id="filterThumb">
  </div>
</div>

<div id="flash" class="flash"></div>

<div id="preview" class="preview">
  <img id="previewImg">
  <button onclick="closePreview()">返回</button>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
const video = document.getElementById('camera');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const overlay = document.getElementById('overlay');
const flash = document.getElementById('flash');
const preview = document.getElementById('preview');
const previewImg = document.getElementById('previewImg');
const thumbImg = document.getElementById('thumbImg');
const filterThumb = document.getElementById('filterThumb');

const filters = [
  { src: "filter1.png", type: "vertical" },
  { src: "filter2.png", type: "vertical" },
  { src: "filter3.png", type: "horizontal" }
];

let currentFilter = 0;

/* 濾鏡切換 */
function updateFilter() {
  const f = filters[currentFilter];
  overlay.src = f.src;
  filterThumb.src = f.src;

  if (f.type === "vertical") {
    filterThumb.className = "vertical-crop";
  } else {
    filterThumb.className = "horizontal-crop";
  }
}

function switchFilter() {
  currentFilter = (currentFilter + 1) % filters.length;
  updateFilter();
}

/* 🎯 核心：裁切 cover（完全不變形） */
function drawCover(ctx, source, sw, sh, dw, dh) {

  const sRatio = sw / sh;
  const dRatio = dw / dh;

  let sx, sy, sWidth, sHeight;

  if (sRatio > dRatio) {
    sHeight = sh;
    sWidth = sh * dRatio;
    sx = (sw - sWidth) / 2;
    sy = 0;
  } else {
    sWidth = sw;
    sHeight = sw / dRatio;
    sx = 0;
    sy = (sh - sHeight) / 2;
  }

  ctx.drawImage(source, sx, sy, sWidth, sHeight, 0, 0, dw, dh);
}

/* 📸 相機初始化（鎖比例 + 高畫質） */
navigator.mediaDevices.getUserMedia({
  video: {
    facingMode: { ideal: "environment" },
    aspectRatio: { ideal: 16/9 },
    width: { ideal: 4096 },
    height: { ideal: 2160 }
  }
}).then(stream => {
  video.srcObject = stream;
});

/* 📷 拍照 */
function takePhoto() {

  const vw = video.videoWidth;
  const vh = video.videoHeight;

  const isHorizontal = filters[currentFilter].type === "horizontal";

  if (isHorizontal) {
    canvas.width = 1920;
    canvas.height = 1080;
  } else {
    canvas.width = 1080;
    canvas.height = 1920;
  }

  // 畫影像（不拉伸）
  drawCover(ctx, video, vw, vh, canvas.width, canvas.height);

  // 疊濾鏡
  drawCover(
    ctx,
    overlay,
    overlay.naturalWidth || canvas.width,
    overlay.naturalHeight || canvas.height,
    canvas.width,
    canvas.height
  );

  /* 閃光效果 */
  flash.style.opacity = 1;
  setTimeout(()=> flash.style.opacity = 0, 100);

  const data = canvas.toDataURL('image/png');

  previewImg.src = data;
  thumbImg.src = data;
  preview.style.display = "flex";

  /* 下載 */
  const now = new Date();
  const filename =
    now.getFullYear()+"-"+
    String(now.getMonth()+1).padStart(2,'0')+"-"+
    String(now.getDate()).padStart(2,'0')+"_"+
    String(now.getHours()).padStart(2,'0')+
    String(now.getMinutes()).padStart(2,'0')+
    String(now.getSeconds()).padStart(2,'0')+".png";

  const link = document.createElement('a');
  link.download = filename;
  link.href = data;
  link.click();
}

function closePreview(){
  preview.style.display = "none";
}

updateFilter();
</script>

</body>
</html>
